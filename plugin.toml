#:schema .build/jpt/configs/plugin.schema.json
schema = 1

[plugin]
id = "music-metadata-manager"
name = "Music Metadata Manager"
guid = "86400cc2-d51e-4695-82c0-5d4f61d3a1f7"
assembly = "Jellyfin.Plugin.MusicMetadataManager"
repository = "rakuzen25/jellyfin-plugin-music-metadata-manager"
owner = "rakuzen25"
description = "Explicit music metadata corrections with preview and activation; original media stays unchanged."
overview = "Review music metadata corrections, artist identities and library issues"
category = "Music"

[host]
abi = "12.2.0.0"
framework = "net10.0"
platform = "linux/amd64"
image = "jellyfin/jellyfin@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037"

[backend]
entry = "src/Host/Plugin.csproj"
project_assemblies = [
  "MusicMetadataManager.Application",
  "MusicMetadataManager.Core",
  "MusicMetadataManager.Infrastructure",
]
tests = [
  "tests/backend/Application/MusicMetadataManager.Application.Tests.csproj",
  "tests/backend/Core/MusicMetadataManager.Core.Tests.csproj",
  "tests/backend/Infrastructure/MusicMetadataManager.Infrastructure.Tests.csproj",
  "tests/backend/Host/MusicMetadataManager.Host.Tests.csproj",
]
source_roots = ["src", "tests/backend"]

[backend.projects]
Application = "src/Application/MusicMetadataManager.Application.csproj"
Core = "src/Core/MusicMetadataManager.Core.csproj"
Infrastructure = "src/Infrastructure/MusicMetadataManager.Infrastructure.csproj"
Host = "src/Host/Plugin.csproj"

[validation]
renovate_tests = "tests/tooling/renovate-policy.mjs"
groups = ["metadata", "frontend", "backend", "tooling", "workflow", "artifacts"]
check_targets = ["frontend", "backend", "tooling", "automation", "docs"]
unit_groups = ["frontend", "backend", "tooling"]
acceptance_groups = ["workflow", "installation", "reproducibility"]


[validation.job_names]

[images]
playwright = "mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea"

[architecture.edges]
"src/Application/MusicMetadataManager.Application.csproj" = [
  "src/Core/MusicMetadataManager.Core.csproj",
]
"src/Core/MusicMetadataManager.Core.csproj" = []
"src/Infrastructure/MusicMetadataManager.Infrastructure.csproj" = [
  "src/Application/MusicMetadataManager.Application.csproj",
  "src/Core/MusicMetadataManager.Core.csproj",
]
"src/Host/Plugin.csproj" = [
  "src/Application/MusicMetadataManager.Application.csproj",
  "src/Core/MusicMetadataManager.Core.csproj",
  "src/Infrastructure/MusicMetadataManager.Infrastructure.csproj",
]
"tests/backend/Application/MusicMetadataManager.Application.Tests.csproj" = [
  "src/Application/MusicMetadataManager.Application.csproj",
]
"tests/backend/Core/MusicMetadataManager.Core.Tests.csproj" = [
  "src/Core/MusicMetadataManager.Core.csproj",
]
"tests/backend/Infrastructure/MusicMetadataManager.Infrastructure.Tests.csproj" = [
  "src/Infrastructure/MusicMetadataManager.Infrastructure.csproj",
]
"tests/backend/Host/MusicMetadataManager.Host.Tests.csproj" = [
  "src/Host/Plugin.csproj",
]

[architecture.forbidden]
"src/Application" = [
  "MediaBrowser.",
  "Jellyfin.",
  "Plugin.Instance",
  "System.Net.Http",
  "System.IO.File",
]
"src/Core" = [
  "Microsoft.Data.Sqlite",
  "MediaBrowser.",
  "Jellyfin.",
  "System.Net.Http",
  "Plugin.Instance",
]
"src/Infrastructure" = ["MediaBrowser.", "Jellyfin.", "Plugin.Instance"]

[frontend]
enabled = true
directory = "frontend"
admin_entry = "admin/config.ts"
admin_template = "frontend/admin/config.html"
admin_styles = "frontend/admin/styles.css"
boundary_check = "frontend/check-boundaries.mjs"
script_marker = "<!-- PLUGIN_CONFIG_SCRIPT -->"
style_marker = "/* PLUGIN_STYLES */"
extra_assets = []
required_assets = ["config.html"]
reload_assets = []

[frontend.entries]

[browser]
directory = "tests/browser"
groups = "tests/browser/groups.json"

[sandbox]
asset_prefix = "/__no_plugin_assets__/"
settings_page = "musicmetadatamanager"

[source]
roots = ["src", "frontend", "tests", "docs", ".github"]

[distribution]
web = false
notices = [
  { source = "LICENSE" },
  { source = "NOTICE" },
  { source = "GPL-3.0.txt" },
]
licensed_paths = []

[distribution.licenses."MusicMetadataManager.Application.dll"]
license = "Apache-2.0"
notices = ["LICENSE", "GPL-3.0.txt"]

[distribution.licenses."Jellyfin.Plugin.MusicMetadataManager.dll"]
license = "Apache-2.0"
notices = ["LICENSE", "GPL-3.0.txt"]

[distribution.licenses."MusicMetadataManager.Core.dll"]
license = "Apache-2.0"
notices = ["LICENSE", "GPL-3.0.txt"]

[distribution.licenses."MusicMetadataManager.Infrastructure.dll"]
license = "Apache-2.0"
notices = ["LICENSE", "GPL-3.0.txt"]

[operations.check-frontend]
after = [
  [
    "node",
    "frontend/check-boundaries.mjs",
  ],
  [
    "{pnpm}",
    "--dir",
    "frontend",
    "exec",
    "tsc",
    "--project",
    "tsconfig.tests.json",
    "--noEmit",
  ],
]

[operations.check-tooling]
after = [
  [
    "{python}",
    "-m",
    "jellyfin_plugin_toolkit",
    "internal",
    "architecture",
  ],
]

[operations.test-workflow]
commands = [
  [
    "{python}",
    "-m",
    "jellyfin_plugin_toolkit",
    "test",
    "browser",
    "--",
    "--project",
    "workflow-chromium",
  ],
]

[operations.test-installation]
commands = [["{python}", "-m", "tests.installation"]]

[advisories]
waivers = []
