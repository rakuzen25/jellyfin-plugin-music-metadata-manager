name: Build draft release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build or retry
        required: true
        type: string
      validated_run_id:
        description: Successful validation run whose immutable artifacts should be attached
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  release:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/release.yml@f6c225ccc9f9e660f7cde484fc31588d79b02a5c # v0.2.0
    with:
      tag: ${{ inputs.tag }}
      validated_run_id: ${{ inputs.validated_run_id }}
